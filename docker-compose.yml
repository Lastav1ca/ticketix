services:
    db:
      image: postgres:17-alpine
      restart: unless-stopped
      ports:
        - "5433:5432"
      environment:
        POSTGRES_USER: ticketix_app
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ticketix
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ticketix_app -d ticketix"]
        interval: 5s
        timeout: 5s
        retries: 5

volumes:
    postgres_data:
